[package]
name = "ezpzxdw-wasm"
description = "WebAssembly bindings for ezpzxdw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ezpzxdw-core = { path = "../ezpzxdw-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
