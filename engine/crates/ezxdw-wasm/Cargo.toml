[package]
name = "ezxdw-wasm"
description = "WebAssembly bindings for ezxdw-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ezxdw-core = { path = "../ezxdw-core" }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
wasm-bindgen = "0.2"
